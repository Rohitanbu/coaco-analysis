<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cocoa — Thermal Quality</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    
    <div class="page">
      <header class="top">
        <div class="brand">Cocoa</div>
        <p class="tagline">Intelligent pod quality analysis</p>
      </header>

      <main class="stage">
        <section class="upload-panel" id="dropzone" tabindex="0">
          <input id="fileInput" type="file" accept="image/*,.csv" multiple hidden />
          <div class="upload-copy">
            <h1>Drop image and waveform</h1>
            <p>Thermal pod scan (JPG/PNG) and acoustic tap (CSV) required.</p>
            <button type="button" class="cta" id="browseBtn">Choose files</button>
          </div>
          <div class="preview-wrap hidden" id="previewWrap">
            <div id="imagePreviewContainer" class="preview-item hidden">
              <img id="preview" alt="Thermal preview" />
            </div>
            <div id="csvPreviewContainer" class="preview-item hidden">
              <div style="font-size:2rem">📊</div>
              <div id="csvName" class="file-name"></div>
            </div>
          </div>
        </section>

        <section class="results hidden" id="results">
          <div class="quality-row">
            <div>
              <div class="eyebrow">Predicted quality</div>
              <div class="quality-code" id="qualityCode">—</div>
              <div class="quality-label" id="qualityLabel">—</div>
            </div>
            <div class="health">
              <div class="eyebrow">Health Status</div>
              <div class="health-value" id="healthStatus">—</div>
            </div>
            <div class="confidence">
              <div class="eyebrow">Confidence</div>
              <div class="confidence-value" id="confidence">—</div>
            </div>
          </div>

          <div class="metrics">
            <article class="metric">
              <div class="metric-name">Amplitude</div>
              <div class="metric-value" id="amplitude">—</div>
              <div class="metric-unit" id="amplitudeUnit">RMS</div>
            </article>
            <article class="metric">
              <div class="metric-name">Frequency</div>
              <div class="metric-value" id="frequency">—</div>
              <div class="metric-unit" id="frequencyUnit">Hz</div>
            </article>
            <article class="metric">
              <div class="metric-name">Power</div>
              <div class="metric-value" id="power">—</div>
              <div class="metric-unit" id="powerUnit">mean-square</div>
            </article>
          </div>

          <div class="probs" id="probs"></div>
          <p class="status" id="status"></p>
        </section>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
